# Use with application.log_rotation: external
# sudo cp deploy/logrotate.conf /etc/logrotate.d/otreader
/opt/otreader/data/otreader.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    # No copytruncate/postrotate needed: WatchedFileHandler reopens the file automatically.
}
