[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otreader"
version = "1.0.0"
description = "LLRP RFID race timing middleware (pyllrp + FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyllrp>=3.1.1,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "asyncssh>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
otreader = "app.main:main"
otreader-simulator = "app.llrp.simulator:main"
otreader-calibrate = "app.timing.calibration:main"
otreader-antenna-test = "clients.antenna_test:main"

[tool.setuptools.packages.find]
include = ["app*", "clients*"]

[tool.setuptools.package-data]
app = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = [
    "hardware: requires a physical LLRP reader (set OTREADER_HARDWARE_HOST)",
]
addopts = "-m 'not hardware'"
filterwarnings = [
    "ignore::DeprecationWarning:pyllrp.*",
]
